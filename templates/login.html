<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, rgb(217, 241, 241), rgba(255,255,255,0.05));
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 35px 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            width: 90%; 
            max-width: 420px;
        }

        .card h2 {
            margin: 0 0 20px 0;
            color: #111827;
            font-size: 22px;
        }

        label {
            font-size: 14px;
            color: #374151;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            margin: 5px 0 15px 0;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #16a34a;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #16a34a;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #15803d;
        }

        p {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #555;
        }

        p a {
            color: #16a34a;
            text-decoration: none;
            font-weight: 500;
        }

          @media (max-width: 768px) {
    .card {
        width: 95%;      /* ← mobile la almost full width */
        padding: 30px 20px;
    }
}
    </style>
</head>
<body>

<div class="card">
    <h2>Login to Your Account</h2>

    <form method="POST">
        {% csrf_token %}

        <label>Username:</label>
        <input type="text" name="username" required>

        <label>Password:</label>
        <input type="password" name="password" required>

        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? 
       <a href="{% url 'register' %}">Register here</a>
    </p>
</div>

</body>
</html>
