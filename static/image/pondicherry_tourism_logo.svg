  <!-- Tagline dividers -->
  <line x1="185" y1="325" x2="255" y2="325" stroke="#D47B3F" stroke-width="1" opacity="0.7" style="fill:rgb(0, 0, 0);stroke:rgb(212, 123, 63);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <text x="340" y="333" text-anchor="middle" font-family="Georgia, serif" font-size="11" fill="#D47B3F" letter-spacing="6" style="fill:rgb(212, 123, 63);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:11px;font-weight:400;text-anchor:middle;dominant-baseline:auto">TOURISM</text>
  <line x1="425" y1="325" x2="495" y2="325" stroke="#D47B3F" stroke-width="1" opacity="0.7" style="fill:rgb(0, 0, 0);stroke:rgb(212, 123, 63);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.7;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- Tagline -->
  <text x="340" y="358" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#8B6240" letter-spacing="1" font-style="italic" style="fill:rgb(139, 98, 64);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, serif;font-size:12px;font-weight:400;font-style:italic;text-anchor:middle;dominant-baseline:auto">La Ville Magnifique — Where France Meets India</text>

  <!-- Bottom decorative line -->
