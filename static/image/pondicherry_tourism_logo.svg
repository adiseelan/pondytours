  <!-- Shutters -->
  <line x1="235" y1="132" x2="235" y2="172" stroke="#2A7FA0" stroke-width="0.8" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(42, 127, 160);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="221" y1="152" x2="249" y2="152" stroke="#2A7FA0" stroke-width="0.8" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(42, 127, 160);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === FRENCH ARCH (right) === -->
  <path d="M420,200 L420,145 Q420,118 445,118 Q470,118 470,145 L470,200" fill="none" stroke="#2A7FA0" stroke-width="2.5" style="fill:none;stroke:rgb(42, 127, 160);color:rgb(0, 0, 0);stroke-width:2.5px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <rect x="418" y="198" width="54" height="6" rx="2" fill="#2A7FA0" style="fill:rgb(42, 127, 160);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <ellipse cx="445" cy="152" rx="14" ry="20" fill="#A8D8EA" stroke="#2A7FA0" stroke-width="1" style="fill:rgb(168, 216, 234);stroke:rgb(42, 127, 160);color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="445" y1="132" x2="445" y2="172" stroke="#2A7FA0" stroke-width="0.8" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(42, 127, 160);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <line x1="431" y1="152" x2="459" y2="152" stroke="#2A7FA0" stroke-width="0.8" opacity="0.5" style="fill:rgb(0, 0, 0);stroke:rgb(42, 127, 160);color:rgb(0, 0, 0);stroke-width:0.8px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.5;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

