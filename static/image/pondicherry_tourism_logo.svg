  <!-- Wave 2 -->
  <path d="M180,238 Q215,226 250,238 Q285,250 320,238 Q355,226 390,238 Q425,250 460,238 Q475,232 500,238 L500,255 L180,255 Z" fill="#2A7FA0" opacity="0.28" style="fill:rgb(42, 127, 160);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.28;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>
  <!-- Wave 3 -->
  <path d="M180,250 Q220,240 255,252 Q290,264 325,252 Q360,240 395,252 Q430,264 465,252 Q480,246 500,250 L500,268 L180,268 Z" fill="#2A7FA0" opacity="0.45" style="fill:rgb(42, 127, 160);stroke:none;color:rgb(0, 0, 0);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:0.45;font-family:&quot;Anthropic Sans&quot;, -apple-system, &quot;system-ui&quot;, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto"/>

  <!-- === TEXT === -->
